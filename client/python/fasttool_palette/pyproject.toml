[project]
name = "fasttool-palette"
version = "0.1.0"
description = "Python client shim for the FastTool bridge — lets a Python FastTools app be palette-managed by FastCommandCenter"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = ["pywin32>=310"]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "types-pywin32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fasttool_palette"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["fasttool_palette"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
